<!DOCTYPE html>
<html>
    <head>
        <title> Html form</title>

    </head>
    <body>
        <h1>heading</h1>
        <h2>heading</h2>
        <p>this is paragraph</p>
        <form method="get">
            <label for="username">username</label>
            <input type="text" id="username" name="username"/>
            <br>
            <br>
            <label for="email">email</label>
            <input type="email" id="emailaddress" name="emailaddress"/>
            <br>
            <br>
            <label for="password">password</label>
            <input type="password" id="password" password="password"/>
            <br>
            <br>
            
            <label for="age">age</label>
            <input type="number" id="number" name="age"/>
            <br>
            <p>select gender</p>
            <label for="male">female</label>
            <input type="radio" id="male" name="gender" value="female">
            <label for="female">male</label>
            <input type="radio" id="female" name="gender" value="male">
            <p>choose hobies</p>
            <label for="sport">sport</label>
            <input type="checkbox" id="sport" name="hobies" value="sport">
            <label for="art">art</label>
            <input type="checkbox" id="art" name="hobies" value="art">
            <label for="music">music</label>
            <input type="checkbox" id="music" name="hobies" value="music">
            <br>
            <br>
            <label for="country">country</label>
            <select id="country" name="country">
            <option value="eth">ethiopia</option>
            <option value="us">america</option>
            <option value="uk">unitedkingdom</option>
            </select>
            <br>
            <br>
            <label for="comment">comment</label>
            <textarea id="comment" name="comment"></textarea>
            
            <button type="submit">submit</button>
            <button type="Reset">Reset</button>
        </form>
    </body>
</html>

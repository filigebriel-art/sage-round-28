<!DOCTYPE html>
<html>
    <head>
        <title>Javascript</title>
        <script>
            function internalAlert(){
                alert("internal");
            }
        </script>
    </head>

        <h1 id="title">welcome</h1>
        <button onclick="alert('hello')">Inline</button>

    </body>
    <script src="./script.js"></script>
</html>
